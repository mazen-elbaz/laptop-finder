<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites | Student Laptop Finder</title>
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body>
    <nav class="site-nav">
      <ul class="nav-list">
        <li class="brand"><a href="index.html">Laptop Finder</a></li>
        <li><a href="index.html">Home</a></li>
        <li><a href="laptops.html">Laptops</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="favorites.html" aria-current="page">Favorites</a></li>
      </ul>
    </nav>
    <main class="p-6 md:p-12">
      <div class="flex flex-wrap justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">Favorite Laptops</h1>
          <p>
            Total value: <span id="favorites-total">0</span> | Average:
            <span id="favorites-average">0</span>
          </p>
        </div>
        <button
          id="clear-favorites"
          class="btn-action btn-danger"
          type="button"
        >
          Clear favorites
        </button>
      </div>
      <p id="error-message" role="status" class="my-4"></p>
      <div id="loading-skeleton"></div>
      <div
        id="favorites-grid"
        class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6"
      ></div>
    </main>
    <script type="module" src="./js/favorites.js"></script>
  </body>
</html>
